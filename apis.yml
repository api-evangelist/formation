aid: formation
name: Formation Bio
description: >-
  Formation Bio is an AI-native pharmaceutical company building the pharma company of
  the future. Rather than applying AI to drug discovery, it focuses on drug development
  — acquiring and in-licensing clinical-stage drug candidates from pharma companies,
  universities, and biotech firms, then running them through clinical development far
  more efficiently than industry standards using its proprietary AI-native platform,
  data, and fine-tuned models. Led by CEO Benjamine Liu and CTO Linhao Zhang, the company
  raised a $372M Series D in 2024 led by a16z with participation from Sanofi, Sequoia,
  Thrive, Emerson Collective, and others, and partners with Sanofi and OpenAI on custom
  models for the drug development lifecycle. Formation Bio does not currently publish a
  public developer API; this profile tracks its identity and public web surface.
